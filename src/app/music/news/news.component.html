<div class="flex flex-col items-center w-full min-h-screen bg-[#0a0c10] py-12 px-6">
  
  <div class="w-full max-w-4xl mb-8">
    <button routerLink="/list" class="text-slate-400 hover:text-white font-bold flex items-center gap-2 transition-all group">
      <span class="group-hover:-translate-x-1 transition-transform">←</span> Voltar para a Lista
    </button>
  </div>

  <div class="text-center mb-12 w-full max-w-4xl">
    <h1 class="text-6xl font-black mb-4 tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500 drop-shadow-[0_5px_15px_rgba(168,85,247,0.4)]">
      Cadastrar Música
    </h1>
    <p class="text-slate-400 font-bold uppercase tracking-[0.3em] text-[10px]">Preencha os detalhes do novo hit no acervo</p>
  </div>

  <div class="w-full max-w-4xl bg-[#1a1b26] p-10 rounded-[2.5rem] border border-slate-800/60 shadow-2xl">
    
    <form class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <div class="flex flex-col gap-2">
        <label class="text-slate-200 text-xs font-black uppercase tracking-widest ml-4">Nome do Cantor / Banda</label>
        <input type="text" placeholder="Ex: MC Xenon" 
               class="w-full bg-[#0a0c10] text-white px-6 py-4 rounded-full border border-slate-700 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none transition-all font-bold">
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-slate-200 text-xs font-black uppercase tracking-widest ml-4">Título da Música</label>
        <input type="text" placeholder="Ex: Die With A Smile" 
               class="w-full bg-[#0a0c10] text-white px-6 py-4 rounded-full border border-slate-700 focus:border-purple-500 focus:ring-4 focus:ring-purple-500/20 outline-none transition-all font-bold">
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-slate-200 text-xs font-black uppercase tracking-widest ml-4">Estilo / Gênero</label>
        <select class="w-full bg-[#0a0c10] text-white px-6 py-4 rounded-full border border-slate-700 focus:border-green-500 outline-none transition-all font-bold appearance-none">
          <option value="Pop">Pop</option>
          <option value="Rock">Rock</option>
          <option value="Sertanejo">Sertanejo</option>
          <option value="Funk">Funk</option>
          <option value="Pagode">Pagode</option>
          <option value="Religioso">Religioso</option>
          <option value="Internacional">Internacional</option>
        </select>
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-slate-200 text-xs font-black uppercase tracking-widest ml-4">Data de Cadastro</label>
        <input type="date" 
               class="w-full bg-[#0a0c10] text-white px-6 py-4 rounded-full border border-slate-700 focus:border-pink-500 outline-none transition-all font-bold color-scheme-dark">
      </div>

      <div class="md:col-span-2 mt-6">
        <button class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-black py-5 rounded-full text-sm uppercase tracking-[0.3em] transition-all shadow-xl hover:-translate-y-1 active:scale-95">
          🚀 Finalizar Cadastro
        </button>
      </div>

    </form>
  </div>

</div>
